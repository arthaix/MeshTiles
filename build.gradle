plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '1.4.9'
}

group = 'ru.arthaix.meshtiles'
version = '1.0.0'
archivesBaseName = 'meshtiles'

// Minecraft 1.12.2 needs Java 8 bytecode (FML's ASM cannot read newer class files)
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '39'
    username = 'Dev'
    extraRunJvmArguments.add('-Xmx4G')
}

repositories {
    mavenCentral()
    // LittleTiles 1.5.14 and CreativeCore 1.10.61 jars, see README ("Building")
    maven { url = uri("${rootDir}/localmaven") }
}

// Optional-dependency interfaces referenced by LittleTiles' class hierarchy (compile only, never packaged)
sourceSets {
    stubs { java.srcDir 'src/stubs/java' }
}

dependencies {
    compileOnly sourceSets.stubs.output
    implementation rfg.deobf('com.creativemd:creativecore:1.10.61')
    implementation rfg.deobf('com.creativemd:littletiles:1.5.14')
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', minecraft.mcVersion.get()
    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': minecraft.mcVersion.get()
    }
}
